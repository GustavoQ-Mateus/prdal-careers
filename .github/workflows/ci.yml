name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build shared-types
        working-directory: packages/shared-types
        run: npm install --workspaces=false && npm run build
      - name: Build api
        working-directory: apps/api
        run: npm ci --workspaces=false && npm run build
      - name: Testes da api
        working-directory: apps/api
        run: node --test test/*.test.js
      - name: Contrato das tools do conjunto do agente atualizado
        working-directory: apps/api
        run: |
          node dist/scripts/exportar-tools.js ../ai-service/evals/agente/tools.json
          git diff --exit-code -- ../ai-service/evals/agente/tools.json
      - name: Build web
        working-directory: apps/web
        run: npm ci --workspaces=false && npm run typecheck && npm run build
      - name: Testes do web
        working-directory: apps/web
        run: npm test

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-paraphrase-multilingual-MiniLM-L12-v2
      - name: Install deps
        working-directory: apps/ai-service
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest
      - name: Import check
        working-directory: apps/ai-service
        run: python -c "import app.main"
      - name: Testes do ai-service
        working-directory: apps/ai-service
        run: PYTHONPATH=. python -m pytest -q
      - name: Conjuntos de geracao e agente com cliente falso
        working-directory: apps/ai-service
        run: |
          python -m evals.rodar --conjunto geracao --falso --saida "$RUNNER_TEMP/falso/geracao"
          python -m evals.rodar --conjunto agente --falso --saida "$RUNNER_TEMP/falso/agente"

  doc-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        working-directory: apps/doc-service
        run: dotnet build -c Release
      - name: Testes do doc-service
        working-directory: apps/doc-service
        run: dotnet test tests

  mudancas-de-ia:
    runs-on: ubuntu-latest
    outputs:
      rag: ${{ steps.filtro.outputs.rag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            rag:
              - apps/ai-service/app/rag.py
              - apps/ai-service/evals/*.py
              - apps/ai-service/evals/linha_de_base.json
              - apps/ai-service/evals/rag/**
              - .github/workflows/ci.yml

  avaliacao-rag:
    needs: mudancas-de-ia
    if: needs.mudancas-de-ia.outputs.rag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-paraphrase-multilingual-MiniLM-L12-v2
      - name: Install deps
        working-directory: apps/ai-service
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Roda o conjunto
        working-directory: apps/ai-service
        run: python -m evals.rodar --conjunto rag --saida "$RUNNER_TEMP/relatorios/rag"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avaliacao-rag
          path: ${{ runner.temp }}/relatorios/rag
